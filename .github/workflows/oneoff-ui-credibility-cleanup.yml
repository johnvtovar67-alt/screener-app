name: Opportunity allocation consistency

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run opportunity allocation consistency fix'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Patch opportunity display consistency
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('pages/index.js')
          s=p.read_text()
          old='''    const owned=portfolio.find(p=>p.symbol===sym(s));if(!owned)return d;'''
          new='''    const signal=capitalSignalEligible({target:s,action:d.action,persistence:s.signalPersistence});\n    const owned=portfolio.find(p=>p.symbol===sym(s));\n    if(!owned&&!signal.pass)return{...d,timing:"Await Confirmation",size:"Qualified — Not Funded",reason:`${d.reason} Portfolio action: ${signal.reason}`};\n    if(!owned)return d;'''
          if old not in s:
              raise SystemExit('opportunityDecision marker not found')
          p.write_text(s.replace(old,new,1))

          r=Path('tools/portfolio-action-summary-regression.cjs')
          t=r.read_text()
          marker="assert(!page.includes('<b>⏱ Swing Time Reviews</b><p>'),'legacy oversized time-review panel still present');"
          extra="\nassert(page.includes('timing:\"Await Confirmation\"')&&page.includes('size:\"Qualified — Not Funded\"'),'Buy cards can still imply executable deployment when the portfolio capital signal is not fundable');"
          if extra.strip() not in t:
              if marker not in t:
                  raise SystemExit('regression marker not found')
              t=t.replace(marker,marker+extra,1)
              r.write_text(t)
          PY
      - name: Install and verify
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit consistency fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/index.js tools/portfolio-action-summary-regression.cjs
          git commit -m 'Align opportunity cards with portfolio deployability'
          git push origin HEAD:main
