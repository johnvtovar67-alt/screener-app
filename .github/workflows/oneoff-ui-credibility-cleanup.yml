name: Opportunity allocation consistency

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply opportunity allocation consistency patch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Make opportunity cards consistent with deployability
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path='pages/index.js';
          let s=fs.readFileSync(path,'utf8');
          const from=`  function opportunityDecision(s){
    const d=fd(s),special=specialSituation(s);if(special?.blockNewCapital)return{...d,action:"Watch",timing:"Wait",size:"None",reason:"Acquisition pending — ordinary Swing Buy/Strong Buy signals are disabled. Evaluate the merger spread, closing risk, RKLB collar exposure, and opportunity cost instead."};if(!["Strong Buy","Buy"].includes(d.action))return d;
    const owned=portfolio.find(p=>p.symbol===sym(s));if(!owned)return d;`;
          const to=`  function opportunityDecision(s){
    const d=fd(s),special=specialSituation(s);if(special?.blockNewCapital)return{...d,action:"Watch",timing:"Wait",size:"None",reason:"Acquisition pending — ordinary Swing Buy/Strong Buy signals are disabled. Evaluate the merger spread, closing risk, RKLB collar exposure, and opportunity cost instead."};if(!["Strong Buy","Buy"].includes(d.action))return d;
    const signal=capitalSignalEligible({target:s,action:d.action,persistence:s.signalPersistence});
    const owned=portfolio.find(p=>p.symbol===sym(s));
    if(!owned&&!signal.pass)return{...d,timing:"Await Confirmation",size:"Qualified — Not Funded",priority:d.priority,reason:\`${'${d.reason}'} Portfolio action: ${'${signal.reason}'}\`};
    if(!owned)return d;`;
          if(!s.includes(from))throw new Error('opportunityDecision marker not found');
          s=s.replace(from,to);
          fs.writeFileSync(path,s);

          const reg='tools/portfolio-action-summary-regression.cjs';
          let r=fs.readFileSync(reg,'utf8');
          const marker="assert(!page.includes('<b>⏱ Swing Time Reviews</b><p>'),'legacy oversized time-review panel still present');";
          const add=`${marker}\nassert(page.includes('timing:\"Await Confirmation\"')&&page.includes('size:\"Qualified — Not Funded\"'),'Buy cards can still claim immediate partial deployment when the capital signal is not fundable');`;
          if(!r.includes(marker))throw new Error('regression marker not found');
          r=r.replace(marker,add);
          fs.writeFileSync(reg,r);
          NODE
      - name: Install and verify
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit consistency fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/index.js tools/portfolio-action-summary-regression.cjs
          git commit -m 'Align opportunity cards with portfolio deployability'
          git push origin HEAD:main
