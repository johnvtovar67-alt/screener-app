name: C1 research mechanics
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/c1-research/**'
      - '.github/workflows/c1-research.yml'
permissions:
  contents: read
jobs:
  research-mechanics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node tools/c1-research/test.cjs
      - run: node tools/c1-release-freeze-check.cjs
