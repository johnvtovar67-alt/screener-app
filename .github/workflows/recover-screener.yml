name: Recover screener page

on:
  push:
    branches: [main]
    paths:
      - 'tools/run-recover-screener.txt'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore last known-good page
        run: git show ee5714c893cb7f217aa91dd3d9c02fe7894693c0:pages/index.js > pages/index.js
      - name: Apply Reduce and language patch
        run: node tools/recover-and-integrate-reduce.cjs
      - name: Run regression suite
        run: node tools/regression-check.cjs && node tools/reunderwrite-regression.cjs
      - name: Build production app
        run: npm ci && npm run build
      - name: Commit recovered page
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pages/index.js
          git diff --cached --quiet || git commit -m "Recover screener and integrate executable Reduce"
          git push
