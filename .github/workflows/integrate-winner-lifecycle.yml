name: Integrate winner lifecycle

on:
  push:
    paths:
      - 'tools/apply-winner-lifecycle.cjs'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply integration patch
        run: node tools/apply-winner-lifecycle.cjs
      - name: Run regression checks
        run: node tools/regression-check.cjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Commit integration
        run: |
          if git diff --quiet; then
            echo "No integration changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/index.js
          git commit -m "Integrate winner lifecycle into portfolio intelligence"
          git push
