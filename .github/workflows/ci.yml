name: Screener CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: screener-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check C1 collection lifecycle and diagnostic privacy
        run: node tools/c1-index-lifecycle-regression.cjs && node tools/c1-dated-book-regression.cjs && node tools/c1-price-anchors-regression.cjs && node tools/c1-observation-archive-regression.cjs && node tools/c1-baseline-reconciliation-regression.cjs
      - name: Check C1 private-account client state
        run: node tools/c1-account-client-regression.cjs
      - name: Build and run regression suite
        run: npm run verify && npm run build
