name: Screener CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: screener-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build and run regression suite
        run: npm run build
